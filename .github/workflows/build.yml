name: a52sxq bring-up build

on:
  workflow_dispatch:
    inputs:
      DONOR:
        description: 'Donor de comparação/userspace'
        required: true
        default: 'lisa'
        type: string
      ANDROID_VERSION:
        description: 'Versão Android esperada'
        required: true
        default: '15'
        type: string
      HYPEROS_VERSION:
        description: 'Versão HyperOS, se uma fonte autorizada estiver configurada'
        required: true
        default: '2.0'
        type: string
      BUILD_VARIANT:
        description: 'Variante Android'
        required: true
        default: 'userdebug'
        type: choice
        options: [userdebug, eng, user]
      BUILD_MODE:
        description: 'prepare valida; donor-validate verifica o donor; port-stage monta staging; flash-candidate gera ZIP fastbootd experimental; twrp-candidate gera ZIP TWRP experimental; full compila a árvore Android'
        required: true
        default: 'prepare'
        type: choice
        options: [prepare, donor-validate, port-stage, flash-candidate, twrp-candidate, full]
      CLEAN_BUILD:
        description: 'Remover workspaces e saídas antes do build'
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: a52sxq-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DONOR: ${{ inputs.DONOR || 'lisa' }}
  ANDROID_VERSION: ${{ inputs.ANDROID_VERSION || '15' }}
  HYPEROS_VERSION: ${{ inputs.HYPEROS_VERSION || '2.0' }}
  BUILD_VARIANT: ${{ inputs.BUILD_VARIANT || 'userdebug' }}
  BUILD_MODE: ${{ inputs.BUILD_MODE || 'prepare' }}
  HYPEROS_SOURCE_URL: ${{ secrets.HYPEROS_SOURCE_URL }}
  HYPEROS_SOURCE_REF: ${{ secrets.HYPEROS_SOURCE_REF }}
  HYPEROS_SOURCE_COMMIT: ${{ secrets.HYPEROS_SOURCE_COMMIT }}
  HYPEROS_ARCHIVE_URL: https://pixeldrain.com/api/file/s12gJsEx?download=1
  HYPEROS_ARCHIVE_SIZE: '4338708939'
  HYPEROS_ARCHIVE_SHA256: c84941ebece1d99101ae19ffda7f7a4ce911433c49e051d693d7de869fa46edf
  A52SXQ_VENDOR_URL: https://github.com/Mesa-Labs-Archive/proprietary_vendor_samsung_a52sxq/releases/download/A528BXXS6FXA1_BTU/A528BXXS6FXA1_vendor.zip
  A52SXQ_VENDOR_SHA256: dfc8acf78196d21287f137aa07e378cf9df0c6c55805fff1a81ec0c1dc0d3c43
  A52SXQ_KERNEL_URL: https://github.com/Mesa-Labs-Archive/proprietary_vendor_samsung_a52sxq/releases/download/A528BXXS6FXA1_BTU/A528BXXS6FXA1_kernel.tar
  A52SXQ_KERNEL_SHA256: 9175331267f196a19f6d1cf9cc489150ed615396af0e8aeb51972be08336eb04

jobs:
  bringup:
    name: Prepare/build a52sxq (${{ inputs.BUILD_MODE || 'prepare' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean workspace when requested
        if: ${{ inputs.CLEAN_BUILD != 'false' }}
        run: rm -rf .work out dist

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bash coreutils curl git jq lz4 openjdk-17-jdk python3 tar unzip zip zstd ca-certificates

      - name: Check project scripts
        run: |
          chmod +x scripts/*.sh
          ./scripts/setup.sh --check-only

      - name: Install Android 15 partition tools for flash candidate
        if: ${{ env.BUILD_MODE == 'flash-candidate' || env.BUILD_MODE == 'twrp-candidate' }}
        run: |
          git clone --depth 1 https://github.com/Rprop/aosp15_partition_tools /tmp/aosp15_partition_tools
          cd /tmp/aosp15_partition_tools
          git fetch --depth 1 origin 5e92a5d504de33414318ced8bad5507440bb8c30
          git checkout --detach 5e92a5d504de33414318ced8bad5507440bb8c30
          chmod +x linux_glibc_x86_64/lpmake

      - name: Synchronize pinned public sources
        run: |
          if [ "$BUILD_MODE" = full ] || [ "$BUILD_MODE" = donor-validate ] || [ "$BUILD_MODE" = port-stage ] || [ "$BUILD_MODE" = flash-candidate ] || [ "$BUILD_MODE" = twrp-candidate ]; then
            ./scripts/sync.sh --workspace .work --clean --require-hyperos
          else
            ./scripts/sync.sh --workspace .work --clean
          fi

      - name: Apply reviewed patches
        run: ./scripts/patch.sh --source-root .

      - name: Prepare or build
        run: |
          mkdir -p out
          if [ "$BUILD_MODE" = donor-validate ]; then
            ./scripts/validate_donor_archive.sh --source-root . --archive .work/hyperos-donor.zip --report-dir out/donor-validate
            printf 'donor_validation=true\nflashable=false\nboot_confirmed=false\n' > out/build-report.txt
          elif [ "$BUILD_MODE" = port-stage ]; then
            ./scripts/fetch_a52sxq_native.sh --out-dir .work/a52sxq-native --clean
            ./scripts/port_stage.sh --source-root . --donor-archive .work/hyperos-donor.zip --native-dir .work/a52sxq-native --out-dir out/port
            printf 'port_stage=true\nflashable=false\nboot_confirmed=false\n' > out/build-report.txt
          elif [ "$BUILD_MODE" = flash-candidate ]; then
            ./scripts/fetch_a52sxq_native.sh --out-dir .work/a52sxq-native --clean
            LPMTOOLS_DIR=/tmp/aosp15_partition_tools/linux_glibc_x86_64 INSTALL_MODE=fastbootd ./scripts/build_flash_candidate.sh .work/hyperos-donor.zip .work/a52sxq-native out/flash-candidate
            printf 'flash_candidate=true\ninstall_mode=fastbootd\nflashable_candidate=true\nsafe_to_flash=false\nboot_confirmed=false\n' > out/build-report.txt
          elif [ "$BUILD_MODE" = twrp-candidate ]; then
            ./scripts/fetch_a52sxq_native.sh --out-dir .work/a52sxq-native --clean
            LPMTOOLS_DIR=/tmp/aosp15_partition_tools/linux_glibc_x86_64 INSTALL_MODE=twrp ./scripts/build_flash_candidate.sh .work/hyperos-donor.zip .work/a52sxq-native out/twrp-candidate
            printf 'flash_candidate=true\ninstall_mode=twrp\nflashable_candidate=true\nsafe_to_flash=false\nboot_confirmed=false\nrecovery_install_blocked=false\n' > out/build-report.txt
          else
            ./scripts/build.sh \
              --source-root . \
              --out-dir out \
              --mode "$BUILD_MODE" \
              --variant "$BUILD_VARIANT" \
              --donor "$DONOR" \
              --android-version "$ANDROID_VERSION" \
              --hyperos-version "$HYPEROS_VERSION"
          fi

      - name: Verify result
        run: |
          if [ "$BUILD_MODE" = full ]; then
            ./scripts/verify.sh --source-root . --report-dir out/verify --require-images
          else
            ./scripts/verify.sh --source-root . --report-dir out/verify
          fi

      - name: Package staging result
        if: ${{ env.BUILD_MODE != 'flash-candidate' && env.BUILD_MODE != 'twrp-candidate' }}
        run: ./scripts/package.sh --input-dir out --output-dir dist

      - name: Upload staging bundle and reports
        if: ${{ env.BUILD_MODE != 'flash-candidate' && env.BUILD_MODE != 'twrp-candidate' }}
        uses: actions/upload-artifact@v4
        with:
          name: a52sxq-${{ env.BUILD_MODE }}-${{ github.run_number }}
          path: |
            dist/
            out/build-report.txt
            out/verify/build-report.txt
            out/manifest/
            out/logs/
            out/donor-validate/
          if-no-files-found: error
          retention-days: 14

      - name: Upload experimental flash candidate
        if: ${{ env.BUILD_MODE == 'flash-candidate' }}
        uses: actions/upload-artifact@v4
        with:
          name: a52sxq-flash-candidate-${{ github.run_number }}
          path: |
            out/flash-candidate/*.zip
            out/flash-candidate/*.zip.sha256
            out/flash-candidate/package.properties
            out/flash-candidate/manifest/
            out/build-report.txt
            out/verify/build-report.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload experimental TWRP candidate
        if: ${{ env.BUILD_MODE == 'twrp-candidate' }}
        uses: actions/upload-artifact@v4
        with:
          name: a52sxq-twrp-candidate-${{ github.run_number }}
          path: |
            out/twrp-candidate/*.zip
            out/twrp-candidate/*.zip.sha256
            out/twrp-candidate/package.properties
            out/twrp-candidate/manifest/
            out/twrp-candidate/twrp-update-binary
            out/build-report.txt
            out/verify/build-report.txt
          if-no-files-found: error
          retention-days: 14
